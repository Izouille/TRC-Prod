<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parlons de votre futur site — TRC Prod</title>
<meta name="description" content="Quelques questions pour cerner votre projet de site internet. 3 à 5 minutes, sans inscription. TRC Prod — Ethan Trincanato.">
<!-- Aperçu de partage (réseaux sociaux / messageries) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="TRC Prod">
<meta property="og:title" content="Parlons de votre futur site — TRC Prod">
<meta property="og:description" content="Quelques questions pour cerner votre projet de site internet. 3 à 5 minutes, sans inscription.">
<meta property="og:url" content="https://trc-prod.vercel.app/brief.html">
<meta property="og:image" content="https://trc-prod.vercel.app/assets/img/og-cover.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Parlons de votre futur site — TRC Prod">
<meta name="twitter:description" content="Quelques questions pour cerner votre projet de site internet. 3 à 5 minutes.">
<meta name="twitter:image" content="https://trc-prod.vercel.app/assets/img/og-cover.png">
<link rel="icon" href="favicon.svg">
<link rel="alternate icon" href="assets/brand/logo-black.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/brief.css">
</head>
<body>
<div class="wrap">

  <!-- ====== EN-TÊTE DE MARQUE ====== -->
  <div class="brand">
    <a class="brand__home" id="brandHome" href="https://trc-prod.vercel.app/" aria-label="Retour au site TRC Prod">
      <img class="logo" src="assets/brand/logo-white.png" alt="TRC Prod">
    </a>
    <div class="brand__txt">
      <span class="eyebrow" id="brandName">TRC Prod</span>
      <small>Questionnaire de brief — votre site internet</small>
    </div>
  </div>

  <button type="button" class="reset-link" id="resetBtn" hidden>↺ Reprendre à zéro</button>

  <!-- ====== BARRE DE PROGRESSION (masquée sur intro / fin) ====== -->
  <div class="progress" id="progress" hidden>
    <div class="bar"><i id="barFill"></i></div>
    <div class="steps-meta">
      <span>Question <b id="curStep">1</b> / <b id="totStep">20</b></span>
      <span id="stepTitle"></span>
    </div>
  </div>

  <!-- ====== POINT DE MONTAGE (une question à la fois) ====== -->
  <main class="stage" id="app" aria-live="polite"></main>

  <!-- ====== FOOTER PERMANENT ====== -->
  <footer class="site-footer">
    <span class="site-footer__copy">© <span id="year"></span> TRC Prod — Ethan Trincanato. Tous droits réservés.</span>
    <span class="site-footer__credit">Site créé par <a href="https://trc-prod.vercel.app/" target="_blank" rel="noopener">TRC Prod</a></span>
  </footer>

</div>

<div class="toast" id="toast" role="status" aria-live="polite">Copié</div>

<script src="js/brief.js"></script>
<!-- Vercel Web Analytics (actif une fois en ligne + Analytics activé dans le projet) -->
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
